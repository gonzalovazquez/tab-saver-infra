name: Bootstrap Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to bootstrap'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - staging
          - production
      region:
        description: 'AWS region'
        required: true
        type: choice
        default: 'us-east-1'
        options:
          - us-east-1
          - us-west-2
          - eu-central-1

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.6.0
  AWS_REGION: ${{ github.event.inputs.region }}
  ENVIRONMENT: ${{ github.event.inputs.environment }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup OpenTofu
        run: |
          wget https://github.com/opentofu/opentofu/releases/download/v${{ env.TF_VERSION }}/tofu_${{ env.TF_VERSION }}_linux_amd64.zip
          unzip -o tofu_${{ env.TF_VERSION }}_linux_amd64.zip
          sudo mv tofu /usr/local/bin/
          tofu --version
      
      - name: Create Terraform State Backend
        run: |
          BUCKET_NAME="tab-saver-infra-tfstate-${{ env.ENVIRONMENT }}"
          TABLE_NAME="tab-saver-infra-tflock-${{ env.ENVIRONMENT }}"
          
          # Create S3 bucket for state
          if ! aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null; then
            echo "Creating S3 bucket: $BUCKET_NAME"
            aws s3api create-bucket \
              --bucket $BUCKET_NAME \
              --region ${{ env.AWS_REGION }} \
              $(if [ "${{ env.AWS_REGION }}" != "us-east-1" ]; then echo "--create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}"; fi)
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket $BUCKET_NAME \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket $BUCKET_NAME \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
            
            echo "✅ S3 bucket created: $BUCKET_NAME"
          else
            echo "✅ S3 bucket already exists: $BUCKET_NAME"
          fi
          
          # Create DynamoDB table for state locking
          if ! aws dynamodb describe-table --table-name $TABLE_NAME --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "Creating DynamoDB table: $TABLE_NAME"
            aws dynamodb create-table \
              --table-name $TABLE_NAME \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            
            # Wait for table to be created
            aws dynamodb wait table-exists \
              --table-name $TABLE_NAME \
              --region ${{ env.AWS_REGION }}
            
            echo "✅ DynamoDB table created: $TABLE_NAME"
          else
            echo "✅ DynamoDB table already exists: $TABLE_NAME"
          fi
      
      - name: OpenTofu Init
        working-directory: .
        run: |
          tofu init \
            -backend-config="bucket=tab-saver-infra-tfstate-${{ env.ENVIRONMENT }}" \
            -backend-config="key=environments/${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=tab-saver-infra-tflock-${{ env.ENVIRONMENT }}" \
            -upgrade
      
      - name: OpenTofu Plan
        working-directory: .
        run: |
          tofu plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan
      
      - name: OpenTofu Apply
        working-directory: .
        run: |
          tofu apply -auto-approve tfplan
      
      - name: Export Outputs
        working-directory: .
        run: |
          echo "## Infrastructure Bootstrap Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**API Invoke URL:**" >> $GITHUB_STEP_SUMMARY
          tofu output -raw api_invoke_url >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Not available yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**DynamoDB Table:**" >> $GITHUB_STEP_SUMMARY
          tofu output -raw dynamodb_table_name >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Not available yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Lambda Function:**" >> $GITHUB_STEP_SUMMARY
          tofu output -raw lambda_function_name >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Not available yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Save outputs for next workflow
          tofu output -json > outputs.json 2>/dev/null || echo "{}" > outputs.json
      
      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-outputs-${{ env.ENVIRONMENT }}
          path: outputs.json
          retention-days: 1

  notify:
    needs: bootstrap
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.bootstrap.result == 'success'
        run: |
          echo "✅ Infrastructure bootstrapped successfully!"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Region: ${{ env.AWS_REGION }}"
      
      - name: Notify Failure
        if: needs.bootstrap.result == 'failure'
        run: |
          echo "❌ Infrastructure bootstrap failed!"
          exit 1